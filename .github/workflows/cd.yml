# Manual continuous deployment: deploys the app repos' (AWS.Api, AWS.React)
# image tags to an EKS environment. The app repos build and push ghcr images
# themselves (tagged <sha7> + latest); this workflow picks the sha7 of the
# app repos' main HEAD (or an explicit override) and runs k8s/deploy.sh.
#
# Trigger: Actions tab -> "Deploy" -> choose env (optionally pin tags) -> Run.
#
# Auth: the workflow assumes the per-env GitHub OIDC role created by
# terraform (`terraform output -raw ci_role_arn`). No stored kubeconfig:
# kubectl talks to EKS via `aws eks get-token`.
#
# Resource names are derived from the env: cluster aws-deployment-<env>,
# RDS instance aws-deployment-<env>-db (the endpoint/user are resolved at
# runtime with the aws CLI, so nothing goes stale).
#
# Required per env (repo settings):
#   secrets: AWS_ROLE_ARN_<ENV>   (from `terraform output -raw ci_role_arn`)
#            DB_PASSWORD_<ENV>    (must match the RDS password in tfvars)
#            IMAGE_API_KEY_<ENV>
#   vars:    IMAGE_API_URL_<ENV>  (image API base URL for that env)

name: Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        type: choice
        options: [dev, qa, prod]
        default: dev
      api_tag:
        description: "Optional - api + migrations image sha7 (empty = main HEAD)"
        type: string
        default: ""
      react_tag:
        description: "Optional - react image sha7 (empty = main HEAD)"
        type: string
        default: ""

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: ${{ github.event.inputs.env }}
      CLUSTER_NAME: aws-deployment-${{ github.event.inputs.env }}
      RDS_IDENTIFIER: aws-deployment-${{ github.event.inputs.env }}-db
      IMAGE_API_URL: ${{ vars['IMAGE_API_URL_' + github.event.inputs.env] }}
      DB_PASSWORD: ${{ secrets['DB_PASSWORD_' + github.event.inputs.env] }}
      IMAGE_API_KEY: ${{ secrets['IMAGE_API_KEY_' + github.event.inputs.env] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install kubectl
        run: curl -fsSL https://get.k8s.io | bash

      - name: Configure AWS credentials (GitHub OIDC)
        uses: setup-aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets['AWS_ROLE_ARN_' + github.event.inputs.env] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tags (main HEAD sha7, or explicit override)
        env:
          API_TAG_OVERRIDE: ${{ github.event.inputs.api_tag }}
          REACT_TAG_OVERRIDE: ${{ github.event.inputs.react_tag }}
        run: |
          api_tag="${API_TAG_OVERRIDE:-$(git ls-remote https://github.com/michaeltg17/AWS.Api.git refs/heads/main | awk '{print substr($1,1,7)}')}"
          react_tag="${REACT_TAG_OVERRIDE:-$(git ls-remote https://github.com/michaeltg17/AWS.React.git refs/heads/main | awk '{print substr($1,1,7)}')}"
          [ -n "$api_tag" ] || { echo "ERROR: could not resolve an api image tag"; exit 1; }
          [ -n "$react_tag" ] || { echo "ERROR: could not resolve a react image tag"; exit 1; }
          echo "Deploying api=$api_tag react=$react_tag to $ENV_NAME"
          {
            echo "API_TAG=$api_tag"
            echo "REACT_TAG=$react_tag"
          } >> "$GITHUB_ENV"

      - name: Resolve AWS resource values (RDS endpoint + user)
        run: |
          rds_endpoint=$(aws rds describe-db-instances --db-instance-identifier "$RDS_IDENTIFIER" \
            --query 'DBInstances[0].Endpoint.Address' --output text)
          db_user=$(aws rds describe-db-instances --db-instance-identifier "$RDS_IDENTIFIER" \
            --query 'DBInstances[0].MasterUsername' --output text)
          if [ -z "$rds_endpoint" ] || [ "$rds_endpoint" = "None" ]; then
            echo "ERROR: RDS instance $RDS_IDENTIFIER not found (terraform not applied for this env?)"
            exit 1
          fi
          echo "RDS_ENDPOINT=$rds_endpoint" >> "$GITHUB_ENV"
          echo "DB_USER=$db_user" >> "$GITHUB_ENV"

      - name: Render env files
        run: |
          : "${IMAGE_API_URL:?set the IMAGE_API_URL_$ENV_NAME repository variable}"
          : "${DB_PASSWORD:?set the DB_PASSWORD_$ENV_NAME repository secret}"
          : "${IMAGE_API_KEY:?set the IMAGE_API_KEY_$ENV_NAME repository secret}"
          sed \
            -e "s|^IMAGE_API_URL=.*|IMAGE_API_URL=$IMAGE_API_URL|" \
            -e "s|^RDS_ENDPOINT=.*|RDS_ENDPOINT=$RDS_ENDPOINT|" \
            -e "s|^DB_USER=.*|DB_USER=$DB_USER|" \
            -e "s|^API_IMAGE_TAG=.*|API_IMAGE_TAG=$API_TAG|" \
            -e "s|^MIGRATIONS_IMAGE_TAG=.*|MIGRATIONS_IMAGE_TAG=$API_TAG|" \
            -e "s|^REACT_IMAGE_TAG=.*|REACT_IMAGE_TAG=$REACT_TAG|" \
            "k8s/environments/$ENV_NAME.env.example" > "k8s/environments/$ENV_NAME.env"
          printf 'DB_PASSWORD=%s\nIMAGE_API_KEY=%s\n' "$DB_PASSWORD" "$IMAGE_API_KEY" > "k8s/environments/$ENV_NAME.secrets.env"

      - name: Configure kubectl (EKS)
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl version --client
          kubectl get nodes

      - name: Deploy
        run: bash k8s/deploy.sh "$ENV_NAME"
