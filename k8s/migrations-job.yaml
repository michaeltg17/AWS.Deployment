# One-shot migration runner (dbup). Re-run with a new image tag on upgrades:
#   kubectl -n app delete job migrations && kubectl -n app apply -f migrations-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  namespace: app
  labels:
    app: migrations
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: migrations
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.6
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgresql -p 5432 -U postgres -d Database; do
                sleep 2
              done
      containers:
        - name: migrations
          image: ghcr.io/michaeltg17/aws-db-migrations:__MIGRATIONS_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: api-config
                  key: postgresql-connection-string
