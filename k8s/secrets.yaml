# Placeholders __DB_PASSWORD__ and __IMAGE_API_KEY__ are rendered by
# k8s/deploy.sh from environments/<env>.secrets.env. Do NOT commit filled values.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: app
type: Opaque
stringData:
  postgres-password: "__DB_PASSWORD__"
  image-api-key: "__IMAGE_API_KEY__"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-config
  namespace: app
type: Opaque
stringData:
  postgresql-connection-string: "Host=postgresql;Port=5432;Database=Database;Username=postgres;Password=__DB_PASSWORD__"
