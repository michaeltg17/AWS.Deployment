apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: api
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.6
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgresql -p 5432 -U postgres -d Database; do
                sleep 2
              done
      containers:
        - name: api
          image: ghcr.io/michaeltg17/aws-api:__API_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: AWSApi__PostgreSqlConnectionString
              valueFrom:
                secretKeyRef:
                  name: api-config
                  key: postgresql-connection-string
            - name: AWSApi__ImageApiUrl
              value: "__IMAGE_API_URL__"
            - name: AWSApi__ImageApiKey
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: image-api-key
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: app
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
